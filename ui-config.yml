---
type: showroom
antora:
  name: modules
  dir: www
  modules: []
default_width: 45
persist_url_state: true
dev_mode: false
# Start with the guide full width. The OpenShift Console refuses to load in a
# frame, so its tab opens a new browser tab instead.
view_switcher:
  enabled: true
  default_mode: split
tabs:
  - name: Terminal
    path: /terminal
    port: 443
  - name: OpenShift Console
    url: 'https://console-openshift-console.${DOMAIN}'
    external: true
