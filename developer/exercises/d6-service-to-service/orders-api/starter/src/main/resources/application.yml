server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: orders-api
  security:
    oauth2:
      client:
        registration:
          notifications-api:
            provider: workshop
            client-id: orders-api
            client-secret: ${ORDERS_API_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          workshop:
            token-uri: ${WORKSHOP_ISSUER}/protocol/openid-connect/token
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: 1.0
