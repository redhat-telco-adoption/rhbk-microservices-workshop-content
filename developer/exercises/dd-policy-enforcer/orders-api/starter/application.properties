# Policy enforcer for POST /orders/<id>/approve, with quarkus-keycloak-authorization.
# Requirements: the endpoint needs scope order:approve on resource order, and the
# channel claim comes from the X-Network-Zone header, which the cluster's gateway sets.
quarkus.keycloak.policy-enforcer.enabled=true
quarkus.keycloak.policy-enforcer.paths.approve.name=order
quarkus.keycloak.policy-enforcer.paths.approve.paths=/orders/{id}/approve
# ANTI-PATTERN: no method is named, so this entry covers GET, PUT, and DELETE as well as POST.
# ANTI-PATTERN: order:read lets any user approve; approval needs order:approve.
quarkus.keycloak.policy-enforcer.paths.approve.methods.any.scopes=order:read
# ANTI-PATTERN: the request body is whatever the browser sends, so anyone can claim to be a branch.
quarkus.keycloak.policy-enforcer.paths.approve.claim-information-point.claims.channel={request.body['$.channel']}
